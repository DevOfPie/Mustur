# The checks every change has to pass.
#
# `make check` is the local equivalent and the entire content: every step here
# is a make target, so what a step *does* lives in the Makefile, writable by
# whoever builds this repository; what a step *is* — the triggers, the
# permissions block, the pins — lives here, and changing it needs the owner.
# That split is the whole point of the file, and ci/proposed/README.md is where
# it is argued.
#
# Shaped after LinkCtrl's ci.yml, cut to what exists here: no Go, no services,
# no image. Those jobs arrive as new proposals when milestone 2 brings code.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # So a scheduled run catches runner-image drift and rot that no commit
  # introduced.
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Links and anchors resolve, table rows match their headers, the adoption
      # record is checkable, shell scripts pass shellcheck. Adding a check means
      # editing the Makefile, not this file.
      - name: Contract checks
        run: make check
