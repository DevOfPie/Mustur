# The checks every change has to pass.
#
# `make check` is the local equivalent and the entire content: every step here
# is a make target, so what a step *does* lives in the Makefile, writable by
# whoever builds this repository; what a step *is* — the triggers, the
# permissions block, the pins — lives here, and changing it needs the owner.
# That split is the whole point of the file, and ci/proposed/README.md is where
# it is argued.
#
# Shaped after LinkCtrl's ci.yml. Milestone 2 brought Go, so `make check` now
# runs `go build`, `go vet` and `go test` alongside the contract checks, and
# this proposal adds the one thing the Makefile cannot: a pinned toolchain on
# the runner. The version comes from go.mod rather than a literal here, so
# raising it is a change to the module and not to a file the owner has to
# re-apply.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # So a scheduled run catches runner-image drift and rot that no commit
  # introduced.
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Links and anchors resolve, table rows match their headers, the adoption
      # record is checkable, shell scripts pass shellcheck, the Go tree builds
      # and its tests pass, and the committed export cites only identifiers it
      # defines. Adding a check means editing the Makefile, not this file.
      - name: Contract checks
        run: make check
